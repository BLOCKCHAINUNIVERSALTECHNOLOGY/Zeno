[package]
name = "zeno"
version = "0.1.0"
edition = "2021"
description = "Zeno — One Engine, All Data. Hybrid key-value + table + JSON document database in Rust (V0.1 prototype)."
license = "Apache-2.0"

[[bin]]
name = "zeno"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
